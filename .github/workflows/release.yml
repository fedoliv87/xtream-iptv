name: Release

# Runs when a GitHub release is published: one job checks the code, then one job per platform builds its package and attaches it
# to the release. Everything a platform needs (manifest, certificate, packaging script) is in platforms/<name>/; the app code is the
# same for all. The release tag must be a plain semantic version (v1.2.3 or 1.2.3): Tizen widget versions only accept numeric x.y.z.
#
# Assets attached to the release, named xtream-iptv-<version>_<platform>.<ext>:
#   - xtream-iptv-<version>_tizen.wgt   Samsung Tizen, signed production widget   (+ .sha256)
#   - xtream-iptv-<version>_webos.ipk   LG webOS, for TVs in Developer Mode       (+ .sha256)
#   - xtream-iptv-<version>_windows-x64.exe, _macos-x64.dmg, _macos-arm64.dmg, _linux-x64.AppImage, _linux-x64.deb
#                                       desktop app (Electron), not signed        (+ .sha256)
#   - xtream-iptv-<version>_androidtv.apk, _firetv.apk
#                                       Android TV / Fire TV (Capacitor + ExoPlayer)  (+ .sha256)
#
# Secrets: TIZEN_CERT_PASSWORD (password of platforms/tizen/tizencert.p12); ANDROID_KEYSTORE_PASSWORD (and optionally ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD) for platforms/android/release.keystore — without them the APKs are signed with a debug key.
# TMDB and Trakt keys are not part of the build: they are typed in the app Settings.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate tag and derive version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ ! "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag '$TAG' must look like v1.2.3 or 1.2.3 (Tizen needs numeric x.y.z)."
            exit 1
          fi
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - run: npm ci
      - run: npm run lint
      - run: npm test

  # One job per platform, all after `verify`: a platform that fails does not stop the others.
  tizen:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stamp version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Production build for Tizen -> dist/.
      - run: npm run build:tizen

      - name: Sign the widget
        env:
          CERT_PASSWORD: ${{ secrets.TIZEN_CERT_PASSWORD }}
        run: bash platforms/tizen/package.sh "$VERSION" release

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release/* --clobber

  webos:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stamp version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Production build for webOS -> dist/.
      - run: npm run build:webos

      - name: Package the app
        run: bash platforms/webos/package.sh "$VERSION" release

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release/* --clobber

  # The desktop app, each system on its own machine (electron-builder makes the installer of the system it runs on).
  desktop:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: linux
            runner: ubuntu-latest
          - system: windows
            runner: windows-latest
          - system: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Stamp version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Production build for the desktop app -> dist/.
      - run: npm run build:desktop

      - name: Package the app
        run: bash platforms/desktop/package.sh "$VERSION" release "${{ matrix.system }}"

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release/* --clobber

  android:
    needs: verify
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci

      - name: Stamp version
        run: npm version "$VERSION" --no-git-tag-version --allow-same-version

      # Production build for Android -> dist/ (with the launcher icons and the banner in dist/android-res/).
      - run: npm run build:android

      - name: Build the APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: bash platforms/android/package.sh "$VERSION" release all

      - name: Upload assets to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" release/* --clobber
